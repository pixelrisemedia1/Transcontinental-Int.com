name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare independent static site
        run: |
          mkdir -p site-dist/assets
          cp index.html site-dist/index.html
          cp assets/* site-dist/assets/
          cp site-dist/index.html site-dist/404.html
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
